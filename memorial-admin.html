<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>추모영상 관리자 | 삼빛라이프케어</title><style>body{font-family:'Malgun Gothic',sans-serif;background:#f8f7f3;color:#24332e;margin:0}main{max-width:920px;margin:25px auto;padding:14px}section{background:white;padding:20px;border:1px solid #ddd;border-radius:12px;margin-bottom:14px}input,textarea,select{padding:9px;border:1px solid #bbb;border-radius:6px;font:inherit;max-width:100%}input[type=text],input[type=email],input[type=password],textarea{width:100%}button{background:#103f35;color:white;border:0;border-radius:7px;padding:10px;margin:4px;cursor:pointer}button:disabled{opacity:.5}.row{border-top:1px solid #ddd;padding:14px 0}.hint{font-size:13px;color:#666}.hidden{display:none}.error{white-space:pre-wrap}</style></head><body><main><h1>삼빛라이프케어 추모영상 관리자</h1><section id="login"><h2>관리자 로그인</h2><input id="email" type="email" placeholder="Supabase 관리자 이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login-btn">로그인</button></section><div id="dashboard" class="hidden"><section><button id="logout">로그아웃</button><h2>판매 설정</h2><label><input id="sales" type="checkbox"> 추모영상 주문·결제 안내 활성화</label><p class="hint">판매를 켜기 전에 사업자 계좌, 개인정보 처리방침, 주문 테스트를 확인하세요.</p><p>제작비 <input id="price" type="number" min="1000" step="100" value="19900"> 원</p><p>사업자 계좌 입금 안내 (고객에게 공개)</p><textarea id="payment" rows="3" placeholder="은행명 / 계좌번호 / 예금주"></textarea><button id="save">설정 저장</button></section><section><h2>접수 주문</h2><button id="refresh">새로고침</button><div id="orders"></div></section></div><section><p id="status" class="error" role="status"></p></section></main><script>
(()=>{'use strict';const B='https://pdueejkiwlfhacsvyaux.supabase.co',K='sb_publishable_80i1VypishPtoeaiLntTFw_60rW5JwT',A=B+'/functions/v1/memorial-api',e=id=>document.getElementById(id);let token='';const status=t=>e('status').textContent=t;
async function call(action,body){const r=await fetch(A+'?action='+action,{method:body?'POST':'GET',headers:{apikey:K,...(token?{Authorization:'Bearer '+token}:{}),...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'요청 실패');return j}
async function refresh(){const j=await call('admin-orders');const list=e('orders');list.replaceChildren();for(const o of j.orders){const div=document.createElement('div');div.className='row';const h=document.createElement('strong');h.textContent=o.kind+' · '+o.deceased+' · '+o.customer+' ('+o.phone+')';div.append(h);const p=document.createElement('p');p.textContent='주문 '+o.id+' / '+o.status+' / '+o.price+'원 / 사진 '+o.photo_count+'장';div.append(p);const msg=document.createElement('p');msg.textContent=o.message||'';div.append(msg);const sel=document.createElement('select');for(const s of ['submitted','payment_verified','producing','completed','cancelled']){const opt=document.createElement('option');opt.value=s;opt.textContent=s;opt.selected=o.status===s;sel.append(opt)}div.append(sel);const video=document.createElement('input');video.type='url';video.placeholder='완성 영상 URL (HTTPS)';video.value=o.video_url||'';div.append(video);const save=document.createElement('button');save.textContent='주문 상태 저장';save.onclick=async()=>{try{await call('admin-update',{id:o.id,status:sel.value,video_url:video.value});status('주문 상태를 저장했습니다.');await refresh()}catch(err){status(err.message)}};div.append(save);const release=document.createElement('button');release.textContent=o.released?'배포 취소':'장례 종료 확인 · 영상 배포';release.onclick=async()=>{if(!o.released&&!confirm('발인 및 장지 절차가 모두 끝나고 부고장 마감까지 확인하셨습니까? 영상이 공개됩니다.'))return;try{await call('admin-release',{id:o.id,ceremony_closed:!o.released,released:!o.released});status(o.released?'배포를 중단했습니다.':'추모영상을 배포했습니다.');await refresh()}catch(err){status(err.message)}};div.append(release);const photo=document.createElement('button');photo.textContent='사진 링크 받기';photo.onclick=async()=>{try{const j=await call('admin-photos',{id:o.id});for(const u of j.urls){const a=document.createElement('a');a.href=u.url;a.target='_blank';a.rel='noopener';a.textContent='사진 '+u.index+' 보기';a.style.margin='8px';div.append(a)}}catch(err){status(err.message)}};div.append(photo);list.append(div)}if(!j.orders.length)list.textContent='접수된 주문이 없습니다.'}
e('login-btn').onclick=async()=>{try{const r=await fetch(B+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:e('email').value,password:e('password').value})});const j=await r.json();if(!r.ok||!j.access_token)throw Error('로그인 실패');token=j.access_token;e('password').value='';const c=await call('admin-config');e('sales').checked=c.sales_enabled;e('price').value=c.price;e('payment').value=c.payment_instructions||'';e('login').classList.add('hidden');e('dashboard').classList.remove('hidden');await refresh();status('로그인 완료')}catch(err){token='';status(err.message)}};
e('save').onclick=async()=>{try{await call('admin-config-update',{sales_enabled:e('sales').checked,price:Number(e('price').value),payment_instructions:e('payment').value.trim()});status('판매 설정을 저장했습니다.')}catch(err){status(err.message)}};e('refresh').onclick=()=>refresh().catch(err=>status(err.message));e('logout').onclick=()=>{token='';e('dashboard').classList.add('hidden');e('login').classList.remove('hidden');status('로그아웃했습니다.')};
})();
</script></body></html>
